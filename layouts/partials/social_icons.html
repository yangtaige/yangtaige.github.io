<div class="social-icons" {{ with .align}}align="{{.}}" {{- end }}>
    {{- range site.Params.socialIcons }}
    {{- if eq .name "email" }}
    <a href="#" class="obf-email" rel="noopener noreferrer me"
        title="{{ (.title | default .name) | title }}">
        {{ partial "svg.html" . }}
    </a>
    {{- else }}
    <a href="{{ trim .url " " | safeURL }}" target="_blank" rel="noopener noreferrer me"
        title="{{ (.title | default .name) | title }}">
        {{ partial "svg.html" . }}
    </a>
    {{- end }}
    {{- end }}
</div>
<script>(function(){var e=atob('c2h0aWdlcnlhbmdAZ21haWwuY29t');document.querySelectorAll('.obf-email').forEach(function(a){a.href='mailto:'+e;});})();</script>
